<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khmer Converter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Khmer Converter</h1>
      <p class="subtitle">
        Convert Khmer text between legacy font encodings and Unicode.
        Port of the Khmer Software Initiative
        <a href="https://github.com/olivierberten/KhmerConverter">KhmerConverter</a>.
      </p>

      <div class="controls">
        <label>
          Direction
          <select id="direction">
            <option value="l2u">Legacy → Unicode</option>
            <option value="u2l">Unicode → Legacy</option>
          </select>
        </label>
        <label>
          Font
          <select id="font"></select>
        </label>
        <button id="convert" type="button">Convert</button>
      </div>

      <div class="panes">
        <label class="pane">
          <span id="input-label">Legacy text</span>
          <textarea id="input" rows="8" spellcheck="false" placeholder="Paste text here…"></textarea>
        </label>
        <label class="pane">
          <span id="output-label">Unicode text</span>
          <textarea id="output" rows="8" spellcheck="false" readonly></textarea>
          <button id="copy" type="button">Copy</button>
        </label>
      </div>

      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
